# UI Configuration
ui:
  tab_bar:
    background: "#F0F4F8"
    border: "#A8C0D8"
    active_tab:
      background: "#F8FAFC"
      foreground: "#1A2A35"
      border: "#0077CC"
    inactive_tab:
      background: "#DCE4ED"
      foreground: "#6E89A0"
    hover_tab:
      background: "#D0E8F8"

  scrollbar:
    thumb: "#A8C0D8"
    track: "transparent"
    thumb_hover: "#8FABBE"

  split_pane:
    border: "#A8C0D8"
    border_focus: "#0077CC"

  bell:
    visual_flash: "#FFF0CC"