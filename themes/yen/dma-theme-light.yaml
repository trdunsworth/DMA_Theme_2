# DMA Theme Light for Yen
# A semantic color theme focused on blues, teals, turquoises, and greens
# with warm error/warning colors.
# Author: Dunsworth-Mann Analytics LLC
# https://dunsworth-mann.com

name: "DMA Theme Light"
author: "Dunsworth-Mann Analytics LLC"
description: "A semantic color theme focused on blues, teals, turquoises, and greens with warm error/warning colors."

colors:
  # Primary colors
  primary:
    background: "#F8FAFC"
    foreground: "#1A2A35"
    cursor: "#0077CC"
    cursor_text: "#F8FAFC"

  # Selection
  selection:
    background: "#A8D0F0"
    foreground: "#002B5C"

  # ANSI colors (0-15)
  ansi:
    black: "#1A2A35"
    red: "#E80000"
    green: "#009933"
    yellow: "#E88800"
    blue: "#0077CC"
    magenta: "#007F7F"
    cyan: "#00B3B3"
    white: "#A8C0D8"

  # Bright ANSI colors (8-15)
  bright:
    black: "#485C6E"
    red: "#FF1A1A"
    green: "#00B33B"
    yellow: "#FF9F00"
    blue: "#1A91E6"
    magenta: "#1ACECE"
    cyan: "#4DDDDD"
    white: "#F0F4F8"

  # Extended 256-color palette (16-255)
