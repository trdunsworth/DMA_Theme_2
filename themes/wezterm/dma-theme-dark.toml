# DMA Theme Dark for WezTerm
# A semantic color theme focused on blues, teals, turquoises, and greens
# with warm error/warning colors.
# Author: Dunsworth-Mann Analytics LLC
# https://dunsworth-mann.com

[colors]
# Basic colors
foreground = "#E0E8EF"
background = "#0A0F14"
cursor_bg = "#1A91E6"
cursor_fg = "#0A0F14"
cursor_border = "#1A91E6"
selection_fg = "#E0E8EF"
selection_bg = "#003D7A"

# ANSI colors
ansi = [
  "#1E282D",  # black
  "#E80000",  # red
  "#009933",  # green
  "#E88800",  # yellow
  "#007BDB",  # blue
  "#007F7F",  # magenta
  "#00B3B3",  # cyan
  "#C8D6E3",  # white
]

brights = [
  "#485C6E",  # bright black
  "#FF1A1A",  # bright red
  "#00B33B",  # bright green
  "#FF9F00",  # bright yellow
  "#1A91E6",  # bright blue
  "#1ACECE",  # bright magenta
  "#4DDDDD",  # bright cyan
  "#F0F4F8",  # bright white
]

# Additional UI colors
scrollbar_thumb = "#2D4058"
split = "#2D4058"

# Copy mode colors
copy_mode_active_highlight_bg = { Color = "#1A91E6" }
copy_mode_active_highlight_fg = { AnsiColor = "Black" }
copy_mode_inactive_highlight_bg = { Color = "#2D4058" }
copy_mode_inactive_highlight_fg = { AnsiColor = "White" }

# Quick select colors
quick_select_label_bg = { Color = "#1A91E6" }
quick_select_label_fg = { Color = "#FFFFFF" }
quick_select_match_bg = { AnsiColor = "Blue" }
quick_select_match_fg = { Color = "#FFFFFF" }

# Compose cursor
compose_cursor = "#FF9F00"

