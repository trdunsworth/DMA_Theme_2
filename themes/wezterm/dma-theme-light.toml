# DMA Theme Light for WezTerm
# A semantic color theme focused on blues, teals, turquoises, and greens
# with warm error/warning colors.
# Author: Dunsworth-Mann Analytics LLC
# https://dunsworth-mann.com

[colors]
# Basic colors
foreground = "#1A2A35"
background = "#F8FAFC"
cursor_bg = "#0077CC"
cursor_fg = "#F8FAFC"
cursor_border = "#0077CC"
selection_fg = "#1A2A35"
selection_bg = "#A8D0F0"

# ANSI colors
ansi = [
  "#1A2A35",  # black
  "#E80000",  # red
  "#009933",  # green
  "#E88800",  # yellow
  "#0077CC",  # blue
  "#007F7F",  # magenta
  "#00B3B3",  # cyan
  "#A8C0D8",  # white
]

brights = [
  "#485C6E",  # bright black
  "#FF1A1A",  # bright red
  "#00B33B",  # bright green
  "#FF9F00",  # bright yellow
  "#1A91E6",  # bright blue
  "#1ACECE",  # bright magenta
  "#4DDDDD",  # bright cyan
  "#F0F4F8",  # bright white
]

# Additional UI colors
scrollbar_thumb = "#A8C0D8"
split = "#A8C0D8"

# Copy mode colors
copy_mode_active_highlight_bg = { Color = "#0077CC" }
copy_mode_active_highlight_fg = { AnsiColor = "Black" }
copy_mode_inactive_highlight_bg = { Color = "#A8C0D8" }
copy_mode_inactive_highlight_fg = { AnsiColor = "White" }

# Quick select colors
quick_select_label_bg = { Color = "#0077CC" }
quick_select_label_fg = { Color = "#FFFFFF" }
quick_select_match_bg = { AnsiColor = "Blue" }
quick_select_match_fg = { Color = "#FFFFFF" }

# Compose cursor
compose_cursor = "#FF9F00"

