# DMA Theme Light for tmux
# A semantic color theme focused on blues, teals, turquoises, and greens
# with warm error/warning colors.
# Author: Dunsworth-Mann Analytics LLC
# https://dunsworth-mann.com

# Status bar
set -g status-style "fg=#1A2A35,bg=#DCE4ED"
set -g status-left-style "fg=#1A2A35,bg=#DCE4ED,bold"
set -g status-right-style "fg=#1A2A35,bg=#DCE4ED,bold"

# Status bar segments
set -g status-left "#[fg=#F8FAFC,bg=#0077CC,bold] #S #[fg=#0077CC,bg=#DCE4ED]"
set -g status-right "#[fg=#0077CC,bg=#DCE4ED]#[fg=#F8FAFC,bg=#0077CC,bold] %H:%M %d-%b-%y "

# Window status
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=#DCE4ED,bg=#0077CC]#[fg=#F8FAFC,bg=#0077CC,bold] #I:#W #[fg=#0077CC,bg=#DCE4ED]"
set -g window-status-style "fg=#2D4058,bg=#DCE4ED"
set -g window-status-current-style "fg=#1A2A35,bg=#0077CC,bold"
set -g window-status-activity-style "fg=#9E5E00,bg=#DCE4ED,bold"
set -g window-status-bell-style "fg=#E80000,bg=#DCE4ED,bold"
set -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#485C6E"
set -g pane-active-border-style "fg=#0077CC"
set -g pane-border-format " #{pane_index}:#{pane_current_command} "
set -g pane-border-status top

# Message/command line
set -g message-style "fg=#1A2A35,bg=#FFF0CC"
set -g message-command-style "fg=#1A2A35,bg=#D0E8F8"

# Mode indicator
set -g mode-style "fg=#0A0F14,bg=#FF9F00,bold"

# Copy mode
set -g copy-mode-match-style "fg=#1A2A35,bg=#FFF0CC"
set -g copy-mode-current-match-style "fg=#0A0F14,bg=#FF9F00,bold"
set -g copy-mode-mark-style "fg=#1A2A35,bg=#A8D0F0"

# Clock
set -g clock-mode-colour "#0077CC"
set -g clock-mode-style 24

# Bell
set -g visual-bell off
set -g bell-action any

# Titles
set -g set-titles on
set -g set-titles-string "#S:#I:#W - #T"

# Terminal colors (for tmux 2.9+)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Define 256-color palette
# Standard colors (0-15)
set -g @dma_black "#1A2A35"
set -g @dma_red "#E80000"
set -g @dma_green "#009933"
set -g @dma_yellow "#E88800"
set -g @dma_blue "#0077CC"
set -g @dma_magenta "#007F7F"
set -g @dma_cyan "#00B3B3"
set -g @dma_white "#A8C0D8"
set -g @dma_bright_black "#485C6E"
set -g @dma_bright_red "#FF1A1A"
set -g @dma_bright_green "#00B33B"
set -g @dma_bright_yellow "#FF9F00"
set -g @dma_bright_blue "#1A91E6"
set -g @dma_bright_magenta "#1ACECE"
set -g @dma_bright_cyan "#4DDDDD"
set -g @dma_bright_white "#F0F4F8"

# Semantic colors
set -g @dma_error "#E80000"
set -g @dma_warning "#9E5E00"
set -g @dma_info "#0077CC"
set -g @dma_success "#009933"

# Status bar with git info (requires tmux-git plugin or similar)
# set -g status-left "#[fg=#F8FAFC,bg=#0077CC,bold] #S #[fg=#0077CC,bg=#DCE4ED]#{git_status} "
# set -g status-right "#{git_branch} #[fg=#0077CC,bg=#DCE4ED]#[fg=#F8FAFC,bg=#0077CC,bold] %H:%M %d-%b-%y "

# Plugin: tmux-prefix-highlight
set -g @prefix_highlight_fg "#F8FAFC"
set -g @prefix_highlight_bg "#FF9F00"
set -g @prefix_highlight_show_copy_mode "on"
set -g @prefix_highlight_copy_mode_attr "fg=#F8FAFC,bg=#009933,bold"
set -g @prefix_highlight_prefix_prompt "⌨"
set -g @prefix_highlight_copy_prompt "⌘"

# Plugin: tmux-cpu
set -g @cpu_low_fg_color "#009933"
set -g @cpu_medium_fg_color "#9E5E00"
set -g @cpu_high_fg_color "#E80000"
set -g @ram_low_fg_color "#009933"
set -g @ram_medium_fg_color "#9E5E00"
set -g @ram_high_fg_color "#E80000"

# Plugin: tmux-battery
set -g @batt_color_charge_primary_tier1 "#009933"
set -g @batt_color_charge_primary_tier2 "#9E5E00"
set -g @batt_color_charge_primary_tier3 "#E80000"
set -g @batt_color_status_primary_charging "#0077CC"
set -g @batt_color_status_primary_charged "#009933"
set -g @batt_color_status_primary_discharging "#E80000"

# Key bindings for theme switching
bind-key T run-shell "tmux source-file ~/.config/tmux/dma-theme-light.conf && tmux display-message 'DMA Theme Light loaded'"