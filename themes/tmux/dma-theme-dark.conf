# DMA Theme Dark for tmux
# A semantic color theme focused on blues, teals, turquoises, and greens
# with warm error/warning colors.
# Author: Dunsworth-Mann Analytics LLC
# https://dunsworth-mann.com

# Status bar
set -g status-style "fg=#E0E8EF,bg=#101820"
set -g status-left-style "fg=#E0E8EF,bg=#101820,bold"
set -g status-right-style "fg=#E0E8EF,bg=#101820,bold"

# Status bar segments
set -g status-left "#[fg=#0A0F14,bg=#1A91E6,bold] #S #[fg=#1A91E6,bg=#101820]"
set -g status-right "#[fg=#1A91E6,bg=#101820]#[fg=#0A0F14,bg=#1A91E6,bold] %H:%M %d-%b-%y "

# Window status
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=#101820,bg=#1A91E6]#[fg=#0A0F14,bg=#1A91E6,bold] #I:#W #[fg=#1A91E6,bg=#101820]"
set -g window-status-style "fg=#6E89A0,bg=#101820"
set -g window-status-current-style "fg=#E0E8EF,bg=#1A91E6,bold"
set -g window-status-activity-style "fg=#FF9F00,bg=#101820,bold"
set -g window-status-bell-style "fg=#FF1A1A,bg=#101820,bold"
set -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#2D4058"
set -g pane-active-border-style "fg=#1A91E6"
set -g pane-border-format " #{pane_index}:#{pane_current_command} "
set -g pane-border-status top

# Message/command line
set -g message-style "fg=#E0E8EF,bg=#7A4A00"
set -g message-command-style "fg=#E0E8EF,bg=#003D7A"

# Mode indicator
set -g mode-style "fg=#0A0F14,bg=#FF9F00,bold"

# Copy mode
set -g copy-mode-match-style "fg=#E0E8EF,bg=#7A4A00"
set -g copy-mode-current-match-style "fg=#0A0F14,bg=#FF9F00,bold"
set -g copy-mode-mark-style "fg=#E0E8EF,bg=#003D7A"

# Clock
set -g clock-mode-colour "#1A91E6"
set -g clock-mode-style 24

# Bell
set -g visual-bell off
set -g bell-action any

# Titles
set -g set-titles on
set -g set-titles-string "#S:#I:#W - #T"

# Terminal colors (for tmux 2.9+)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Define 256-color palette
# Standard colors (0-15)
set -g @dma_black "#1E282D"
set -g @dma_red "#E80000"
set -g @dma_green "#009933"
set -g @dma_yellow "#E88800"
set -g @dma_blue "#007BDB"
set -g @dma_magenta "#007F7F"
set -g @dma_cyan "#00B3B3"
set -g @dma_white "#C8D6E3"
set -g @dma_bright_black "#485C6E"
set -g @dma_bright_red "#FF1A1A"
set -g @dma_bright_green "#00B33B"
set -g @dma_bright_yellow "#FF9F00"
set -g @dma_bright_blue "#1A91E6"
set -g @dma_bright_magenta "#1ACECE"
set -g @dma_bright_cyan "#4DDDDD"
set -g @dma_bright_white "#F0F4F8"

# Semantic colors
set -g @dma_error "#FF1A1A"
set -g @dma_warning "#FF9F00"
set -g @dma_info "#4DA8EE"
set -g @dma_success "#4DD966"

# Status bar with git info (requires tmux-git plugin or similar)
# set -g status-left "#[fg=#0A0F14,bg=#1A91E6,bold] #S #[fg=#1A91E6,bg=#101820]#{git_status} "
# set -g status-right "#{git_branch} #[fg=#1A91E6,bg=#101820]#[fg=#0A0F14,bg=#1A91E6,bold] %H:%M %d-%b-%y "

# Plugin: tmux-prefix-highlight
set -g @prefix_highlight_fg "#0A0F14"
set -g @prefix_highlight_bg "#FF9F00"
set -g @prefix_highlight_show_copy_mode "on"
set -g @prefix_highlight_copy_mode_attr "fg=#0A0F14,bg=#4DD966,bold"
set -g @prefix_highlight_prefix_prompt "⌨"
set -g @prefix_highlight_copy_prompt "⌘"

# Plugin: tmux-cpu
set -g @cpu_low_fg_color "#4DD966"
set -g @cpu_medium_fg_color "#FF9F00"
set -g @cpu_high_fg_color "#FF1A1A"
set -g @ram_low_fg_color "#4DD966"
set -g @ram_medium_fg_color "#FF9F00"
set -g @ram_high_fg_color "#FF1A1A"

# Plugin: tmux-battery
set -g @batt_color_charge_primary_tier1 "#4DD966"
set -g @batt_color_charge_primary_tier2 "#FF9F00"
set -g @batt_color_charge_primary_tier3 "#FF1A1A"
set -g @batt_color_status_primary_charging "#4DA8EE"
set -g @batt_color_status_primary_charged "#4DD966"
set -g @batt_color_status_primary_discharging "#FF1A1A"

# Key bindings for theme switching
bind-key T run-shell "tmux source-file ~/.config/tmux/dma-theme-dark.conf && tmux display-message 'DMA Theme Dark loaded'"