# DMA Theme Light for Warp
# A semantic color theme focused on blues, teals, turquoises, and greens
# with warm error/warning colors.
# Author: Dunsworth-Mann Analytics LLC
# https://dunsworth-mann.com

name: "DMA Theme Light"
description: "A semantic color theme focused on blues, teals, turquoises, and greens with warm error/warning colors."
author: "Dunsworth-Mann Analytics LLC"

background: "#F8FAFC"
foreground: "#1A2A35"
cursor_color: "#0077CC"
cursor_text_color: "#F8FAFC"
selection_background: "#A8D0F0"
selection_foreground: "#002B5C"

# ANSI colors
ansi_colors:
  - "#1A2A35"  # black
  - "#E80000"  # red
  - "#009933"  # green
  - "#E88800"  # yellow
  - "#0077CC"  # blue
  - "#007F7F"  # magenta
  - "#00B3B3"  # cyan
  - "#A8C0D8"  # white

# Bright ANSI colors
